services:
  ac-database:
    container_name: ac-database
    image: mysql:8.4
    networks:
      - ac-network
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - ac-database:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute 'SHOW DATABASES;' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 40

  ac-db-import:
    container_name: ac-db-import
    image: acore/ac-wotlk-db-import:local
    build:
      context: ./azerothcore
      target: db-import
      dockerfile: apps/docker/Dockerfile
      args:
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-acore}
    networks:
      - ac-network
    environment:
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_LOGIN_DATABASE_INFO: ac-database;3306;root;${MYSQL_ROOT_PASSWORD:-root};acore_auth
      AC_WORLD_DATABASE_INFO: ac-database;3306;root;${MYSQL_ROOT_PASSWORD:-root};acore_world
      AC_CHARACTER_DATABASE_INFO: ac-database;3306;root;${MYSQL_ROOT_PASSWORD:-root};acore_characters
    volumes:
      - ac-etc:/azerothcore/env/dist/etc
      - ac-logs:/azerothcore/env/dist/logs
    depends_on:
      ac-database:
        condition: service_healthy

  ac-client-data-init:
    container_name: ac-client-data-init
    image: acore/ac-wotlk-client-data:local
    build:
      context: ./azerothcore
      target: client-data
      dockerfile: apps/docker/Dockerfile
      args:
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-acore}
    volumes:
      - ac-client-data:/azerothcore/env/dist/data

  ac-worldserver:
    container_name: ac-worldserver
    image: acore/ac-wotlk-worldserver:local
    build:
      context: ./azerothcore
      target: worldserver
      dockerfile: apps/docker/Dockerfile
      args:
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-acore}
    networks:
      - ac-network
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_LOGIN_DATABASE_INFO: ac-database;3306;root;${MYSQL_ROOT_PASSWORD:-root};acore_auth
      AC_WORLD_DATABASE_INFO: ac-database;3306;root;${MYSQL_ROOT_PASSWORD:-root};acore_world
      AC_CHARACTER_DATABASE_INFO: ac-database;3306;root;${MYSQL_ROOT_PASSWORD:-root};acore_characters
    ports:
      - "${WORLD_PORT:-8085}:8085"
      - "${SOAP_PORT:-7878}:7878"
    volumes:
      - ac-etc:/azerothcore/env/dist/etc
      - ac-logs:/azerothcore/env/dist/logs
      - ac-client-data:/azerothcore/env/dist/data:ro
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully
      ac-client-data-init:
        condition: service_completed_successfully

  ac-authserver:
    container_name: ac-authserver
    image: acore/ac-wotlk-authserver:local
    build:
      context: ./azerothcore
      target: authserver
      dockerfile: apps/docker/Dockerfile
      args:
        USER_ID: ${DOCKER_USER_ID:-1000}
        GROUP_ID: ${DOCKER_GROUP_ID:-1000}
        DOCKER_USER: ${DOCKER_USER:-acore}
    networks:
      - ac-network
    tty: true
    restart: unless-stopped
    environment:
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_TEMP_DIR: /azerothcore/env/dist/temp
      AC_LOGIN_DATABASE_INFO: ac-database;3306;root;${MYSQL_ROOT_PASSWORD:-root};acore_auth
    volumes:
      - ac-etc:/azerothcore/env/dist/etc
      - ac-logs:/azerothcore/env/dist/logs
    ports:
      - "${AUTH_PORT:-3724}:3724"
    depends_on:
      ac-database:
        condition: service_healthy
      ac-db-import:
        condition: service_completed_successfully

  ac-website:
    build:
      context: ./website
    container_name: ac-website
    restart: unless-stopped
    depends_on:
      ac-database:
        condition: service_healthy
    environment:
      DB_HOST: ac-database
      DB_PORT: 3306
      DB_NAME: acore_auth
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${WEBSITE_PORT:-8080}:80"

volumes:
  ac-database:
  ac-client-data:
  ac-etc:
  ac-logs:

networks:
  ac-network:
